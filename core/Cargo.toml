[package]
name = "felldl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Felldl download engine: multi-connection segmented downloader with resume"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
url = "2"
percent-encoding = "2"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
mime_guess = "2"
# 媒体解密（HLS AES-128，手写 CBC 链）
aes = "0.8"
# 自定义 DNS 解析（仅用自定义 nameserver，不读系统配置以减小体积）
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime"] }
# BitTorrent 客户端（DHT / tracker / magnet 全支持，纯 Rust 免交叉编译坑）
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
librqbit-core = { version = "9", default-features = false }
# FTP / FTPS（rustls-ring：ring 后端便于 Android 交叉编译）
suppaftp = { version = "13", default-features = false, features = ["rustls-ring"] }
# SFTP（russh 全家桶，纯 Rust）
russh = { version = "0.65", default-features = false, features = ["ring"] }
russh-sftp = "4"
# FTPS 根证书
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1"
# 更新包验签（Ed25519）与 SHA256 摘要：ring 已在依赖树中，不引入额外 TLS/加密后端
ring = "0.17"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[example]]
name = "cli"
path = "examples/cli.rs"
