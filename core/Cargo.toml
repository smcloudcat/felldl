[package]
name = "felldl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Felldl download engine: multi-connection segmented downloader with resume"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
url = "2"
percent-encoding = "2"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
mime_guess = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[example]]
name = "cli"
path = "examples/cli.rs"
